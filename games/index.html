<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Riley Cohn Arcade</title>
<meta name="description" content="Games by Riley Cohn. Pick a cartridge and play.">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14101f">
<link rel="apple-touch-icon" href="/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&display=swap">
<link rel="stylesheet" href="/css/arcade.css">
</head>
<body>

<header class="topbar">
  <a href="/">&lt; Back to RileyOS</a>
</header>

<main class="arcade">
  <h1 class="marquee">RILEY COHN ARCADE</h1>
  <p class="prompt">PICK A CARTRIDGE</p>

  <!-- To add a game: copy a .cart link, point href at the game's folder, and set its colour with --c. -->
  <div class="carts">
    <a class="cart" href="/games/duel-dle/" style="--c: #ff3b6b">
      <span class="grip"></span>
      <span class="sticker">
        <span class="name">Duel-dle</span>
        <span class="blurb">Draw an attack. Draw a defense. An AI judge decides who wins. A new enemy every day.</span>
        <span class="play">Play &gt;</span>
      </span>
    </a>
    <div class="cart empty"><span>EMPTY SLOT</span></div>
    <div class="cart empty"><span>EMPTY SLOT</span></div>
  </div>
</main>

<script src="/js/achievements.js"></script>
<script>
  document.querySelectorAll('a.cart').forEach(function (c) {
    c.addEventListener('click', function () { Ach.unlock('player'); });
  });
</script>
</body>
</html>
