<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Riley Cohn Arcade</title>
<meta name="description" content="Small browser games by Riley Cohn. Pick a cartridge and play.">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14101f">
<link rel="apple-touch-icon" href="/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&display=swap">
<link rel="stylesheet" href="/css/arcade.css">
</head>
<body>

<header class="topbar">
  <a href="/">&lt; Back to RileyOS</a>
</header>

<main class="floor">

  <section class="cabinet" aria-label="Arcade cabinet">
    <h1 class="marquee">RILEY COHN ARCADE</h1>
    <div class="bezel">
      <canvas id="screen" width="320" height="240" role="img" aria-label="Game screen"></canvas>
    </div>
    <div class="panel">
      <div class="dpad" aria-label="Direction pad">
        <button data-key="up" aria-label="Up" style="grid-area: u"></button>
        <button data-key="left" aria-label="Left" style="grid-area: l"></button>
        <button data-key="right" aria-label="Right" style="grid-area: r"></button>
        <button data-key="down" aria-label="Down" style="grid-area: d"></button>
      </div>
      <div class="slot">
        <span id="slot-label">NO CARTRIDGE</span>
        <button id="eject" disabled>EJECT</button>
      </div>
      <button class="a-btn" data-key="a" aria-label="A button">A</button>
    </div>
    <p class="hint">Arrows or WASD to move. Space is the A button.</p>
  </section>

  <section class="shelf" aria-label="Cartridges">
    <h2>PICK A CARTRIDGE</h2>
    <div id="carts" class="carts"></div>
  </section>

</main>

<script src="/js/achievements.js"></script>
<script src="/js/arcade.js"></script>
<script src="/games/carts/rockfall.js"></script>
<script src="/games/carts/byteworm.js"></script>
<script src="/games/carts/mystery.js"></script>
</body>
</html>
